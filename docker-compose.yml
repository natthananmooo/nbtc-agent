services:

  mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
      args:
        # โมเดลถูกฝังใน image ตอน build ค่านี้จึงต้องส่งตอน build ด้วย
        # เปลี่ยนใน .env แล้วรัน docker compose up -d --build mcp
        RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
        # ต้องตรงกับที่ lawrag ใช้ตอนทำดัชนี ไม่งั้นผลค้นกฎหมายจะมั่ว
        EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
    container_name: nbtc-mcp
    ports:
      - "8000:8000"
    environment:
      # off = เทียบตัวอักษรอย่างเดียว  bm25 = ตัดคำไทย  rerank = เพิ่ม cross-encoder
      # ตั้งค่าใน .env แล้ว docker compose up -d mcp เพื่อสลับตอนวัดผล
      RAG_MODE: ${RAG_MODE:-off}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      PGDSN: postgresql://law:law@pgvec:5432/law
      LAW_DIR: /data/law
    volumes:
      # ชั้นที่ 4 ของกลไกอ่านอย่างเดียว
      # :ro ทำให้ kernel ปฏิเสธการเขียน และโปรเซสอื่นไม่เห็นไฟล์นี้เลย
      - ./data/complaints.db:/data/complaints.db:ro
      # ดัชนี BM25 และกราฟของชั้นค้นกฎหมาย อ่านอย่างเดียวเหมือนกัน
      - ./data/law:/data/law:ro
      - ./charts:/charts
    depends_on:
      pgvec:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: nbtc-web
    ports:
      - "8080:8080"
    # คีย์ OpenRouter และ Langfuse อ่านจาก .env ไม่ได้ copy เข้า image
    env_file:
      - .env
    environment:
      MCP_URL: http://mcp:8000/mcp
      CHART_DIR: /charts
    volumes:
      # ให้เห็นกราฟที่ mcp วาดไว้
      - ./charts:/charts
    depends_on:
      - mcp
    restart: unless-stopped

  # ฐานข้อมูลเวกเตอร์สำหรับคลังกฎหมาย แยกจาก complaints.db ที่เป็น SQLite อ่านอย่างเดียว
  # ใช้ image ที่มีส่วนขยาย pgvector มาให้แล้ว ไม่ต้อง compile เอง
  pgvec:
    image: pgvector/pgvector:pg17
    container_name: nbtc-pgvec
    environment:
      POSTGRES_USER: law
      POSTGRES_PASSWORD: law
      POSTGRES_DB: law
    ports:
      # เปิด 5433 ออกมาข้างนอก เพื่อให้สคริปต์บนเครื่องต่อเข้ามาดูข้อมูลได้
      - "5433:5432"
    volumes:
      - pgvec-data:/var/lib/postgresql/data
    healthcheck:
      # lawrag ต้องรอจนฐานข้อมูลพร้อมจริง ไม่ใช่แค่คอนเทนเนอร์ขึ้น
      test: ["CMD-SHELL", "pg_isready -U law -d law"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # คอนเทนเนอร์สำหรับงานทำดัชนีและวัดผล ไม่มี server ให้รันค้างไว้
  # อยู่ใน profile tools จึงไม่ขึ้นมาพร้อม docker compose up ธรรมดา
  # เรียกใช้ด้วย docker compose run --rm lawrag python -m lawrag.index
  lawrag:
    build:
      context: .
      dockerfile: lawrag/Dockerfile
      args:
        # โมเดลถูกฝังใน image ตอน build ค่านี้จึงต้องส่งตอน build ด้วย
        EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
    container_name: nbtc-lawrag
    environment:
      PGDSN: postgresql://law:law@pgvec:5432/law
      LAW_DIR: /data/law
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
    volumes:
      # ต้องเขียนได้ เพราะดัชนี BM25 ถูกเก็บเป็นไฟล์ในโฟลเดอร์นี้
      - ./data/law:/data/law
    depends_on:
      pgvec:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  # เก็บข้อมูล Postgres ไว้นอกคอนเทนเนอร์ ลบคอนเทนเนอร์แล้วดัชนีไม่หาย
  pgvec-data:

services:

  mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
      args:
        # โมเดลถูกฝังใน image ตอน build ค่านี้จึงต้องส่งตอน build ด้วย
        # เปลี่ยนใน .env แล้วรัน docker compose up -d --build mcp
        RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
    container_name: nbtc-mcp
    ports:
      - "8000:8000"
    environment:
      # off = เทียบตัวอักษรอย่างเดียว  bm25 = ตัดคำไทย  rerank = เพิ่ม cross-encoder
      # ตั้งค่าใน .env แล้ว docker compose up -d mcp เพื่อสลับตอนวัดผล
      RAG_MODE: ${RAG_MODE:-off}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
    volumes:
      # ชั้นที่ 4 ของกลไกอ่านอย่างเดียว
      # :ro ทำให้ kernel ปฏิเสธการเขียน และโปรเซสอื่นไม่เห็นไฟล์นี้เลย
      - ./data/complaints.db:/data/complaints.db:ro
      - ./charts:/charts
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: nbtc-web
    ports:
      - "8080:8080"
    # คีย์ OpenRouter และ Langfuse อ่านจาก .env ไม่ได้ copy เข้า image
    env_file:
      - .env
    environment:
      MCP_URL: http://mcp:8000/mcp
      CHART_DIR: /charts
    volumes:
      # ให้เห็นกราฟที่ mcp วาดไว้
      - ./charts:/charts
    depends_on:
      - mcp
    restart: unless-stopped

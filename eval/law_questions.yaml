# eval/law_questions.yaml - ชุดคำถามสำหรับวัดว่าการค้นกฎหมายแม่นแค่ไหน
#
# ใช้วัดสองชั้น
#   ชั้นค้น  Failed Retrievals @20 นับว่าในยี่สิบอันดับแรกมี gold อยู่ไหม
#   ชั้นตอบ  ส่งผลค้นให้ LLM ตอบ แล้วเช็กว่าคำตอบอ้างเลขข้อตรงกับ gold ไหม
#
# gold     คือ chunk ที่ถือว่าถูก ถ้าค้นเจออย่างน้อยหนึ่งตัวถือว่าผ่าน
# kind     บอกว่าข้อนี้ทดสอบอะไร ใช้แยกดูผลรายกลุ่มได้
#   easy        คำในคำถามซ้ำกับคำในตัวบทตรง ๆ ทุกวิธีควรหาเจอ
#   vocab_gap   คำที่ชาวบ้านใช้ ไม่มีในตัวบทเลย ต้องพึ่งบริบทหรือการขยายคำค้น
#   numeric     คำตอบเป็นตัวเลขหรือระยะเวลา ตรวจง่ายว่าถูกหรือผิด
#   cross_ref   ต้องข้ามไปอีกข้อหรืออีกฉบับถึงจะตอบครบ เป็นข้อที่กราฟควรช่วย
#   annex       คำตอบอยู่ในภาคผนวก ไม่ได้อยู่ในตัวข้อหลัก
#
# ที่มาของคำถาม เขียนจากมุมผู้ร้องเรียนจริง อิงเรื่องร้องเรียนที่พบบ่อยในฐานข้อมูล
# ยังไม่ได้ตรวจโดยเจ้าของโปรเจ็ค ต้องให้ตรวจก่อนนำไปวัดผล

questions:

  # ---------- กระบวนการร้องเรียน ประกาศ พ.ศ. 2559 ----------
  - id: L01

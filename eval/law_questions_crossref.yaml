# eval/law_questions_crossref.yaml - ชุดคำถามของการทดลองที่สอง
#
# ทำไมต้องมีชุดที่สอง
#   การทดลองที่หนึ่งใช้คำถามผู้ร้องเรียนทั่วไป 50 ข้อ ผลคือกราฟไม่มีผลเลย
#   ตรวจแล้วพบว่ากราฟทำงานได้จริง แผ่ของใหม่ได้กลาง 4 ก้อนต่อคำถาม
#   แต่ของที่แผ่มาเป็นมาตราแม่บทที่ประกาศอ้างถึง ไม่ใช่ข้อปฏิบัติที่คำถามต้องการ
#   สมมติฐานคือ ชนิดของคำถามไม่ตรงกับสิ่งที่กราฟเก่ง ไม่ใช่ว่ากราฟไม่มีประโยชน์
#
# ชุดนี้จึงทดสอบสมมติฐานนั้นโดยตรง ด้วยคำถามที่ต้องตามการอ้างอิงถึงจะตอบครบ
#
# ประกาศไว้ให้ชัด
#   นี่คือคนละชุดคำถาม คนละสมมติฐาน กับการทดลองที่หนึ่ง
#   ไม่ใช่การตั้งคำถามใหม่เพื่อให้กราฟชนะ และ**ไม่ใช้แทนผลของการทดลองที่หนึ่ง**
#   ผลลบของการทดลองที่หนึ่งยังคงอยู่ตามเดิมทุกตัวเลข
#
# เกณฑ์ที่ใช้เลือกคำถาม
#   1. ต้องมีเส้น CITES_CLAUSE จริงในกราฟ ระหว่างข้อต้นทางกับข้อที่เป็นเฉลย
#      คือตัวบทเขียนอ้างถึงกันเองจริง ไม่ใช่เราจับคู่เอง
#   2. ทั้งต้นทางและเฉลยต้องมีก้อนอยู่ในคลัง 682 ก้อน
#   3. คำถามต้องเป็นคำถามที่ผู้ร้องเรียนหรือเจ้าหน้าที่ถามได้จริง
#      ไม่ใช่คำถามที่เขียนขึ้นเพื่อให้ตรงกับเส้นในกราฟ
#   4. ไม่ดูผลการค้นก่อนเขียนคำถาม
#
# ช่อง path บันทึกไว้ว่าเส้นอ้างอิงที่ทำให้คำถามนี้ข้ามข้อคือเส้นไหน เพื่อให้ตรวจย้อนได้
# gold คือข้อปลายทาง ซึ่งเป็นข้อที่ต้องตามการอ้างอิงไปถึง
#
# ยังไม่ได้ตรวจโดยเจ้าของโปรเจ็ค ต้องให้ตรวจก่อนนำไปวัดผล


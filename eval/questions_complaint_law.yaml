    q: สมัครบริการเสริมไว้ แล้วจะยกเลิกกลับยกเลิกไม่ได้ เรื่องแบบนี้ประกาศข้อไหนเขียนไว้ว่าอย่างไร และมีคนร้องเรื่องแบบเดียวกันนี้กับค่ายไหนบ้าง

#
# รูปแบบคำถาม
#   ทุกข้อเริ่มจากหมวดเรื่องร้องเรียนที่มีอยู่จริงในคอลัมน์ category ของฐาน
#   แล้วถามสองชั้นในประโยคเดียว
#     ชั้นที่หนึ่ง  ลักษณะการกระทำแบบนี้ ประกาศฉบับใด ข้อใด วรรคใด เขียนไว้ว่าอย่างไร  -> search_law
#     ชั้นที่สอง   เรื่องร้องเรียนลักษณะเดียวกันนี้ ผู้ให้บริการรายใดถูกร้องบ้าง กี่เรื่อง -> query_complaints
#   agent ต้องเรียกสองเครื่องมือ และต้องไม่เอาตัวเลขจาก RAG หรือเอาข้อกฎหมายจาก SQL
#
# ข้อห้ามที่ตั้งใจใส่ไว้  ต้องไม่มีข้อไหนถามว่า "ผู้ให้บริการรายใดผิดกฎหมาย"
#   เพราะอำนาจวินิจฉัยว่าผิดหรือไม่ผิดเป็นของ กสทช. ไม่ใช่ของ agent
#   คำถามจึงถามแค่ "เข้าข่ายข้อใด" กับ "ถูกร้องเรียนกี่เรื่อง" ซึ่งเป็นข้อเท็จจริงทั้งคู่
#   ช่อง must_not ของแต่ละข้อบันทึกสิ่งที่คำตอบห้ามพูด ใช้ตรวจตอนให้คะแนน
#
# ตัวเลขใน sql_answer คำนวณจาก data/complaints.db ทั้ง 42,806 เรื่อง เมื่อ 2026-11-21
#   รวมชื่อบริษัทเป็นกลุ่มค่ายตาม data/provider_mapping.csv แล้ว
#   ฐานเก็บชื่อบริษัทแยกเป็นหลายนิติบุคคลต่อหนึ่งค่าย เช่น AIS มีทั้ง
#   บริษัท แอดวานซ์ ไวร์เลส เน็ทเวอร์ค จำกัด และ บริษัท แอดวานซ์ อินโฟร์ เซอร์วิส จำกัด (มหาชน)
#
# ช่องว่างที่เคยมี ปิดแล้วเมื่อ 2026-11-21
#   ตอนร่าง 22 ข้อแรก ประกาศ กทช. เรื่อง มาตรฐานของสัญญาให้บริการโทรคมนาคม พ.ศ. 2549
#   ยังไม่อยู่ในคลัง เพราะสกัดข้อความออกมาแล้วอ่านไม่ออก
#   ภายหลังพบว่าวรรณยุกต์ไม่ได้หาย ฟอนต์เก็บไว้ในเขต Private Use Area ที่เราอ่านไม่เป็น
#   แก้ตารางแปลงอักขระใน extract.py แล้วได้ประกาศฉบับนี้คืนมาทั้ง 37 ก้อน
#   หมวดร้องเรียนที่เคยเลี่ยงจึงกลับมาถามได้ทั้งหมด อยู่ในชุด S01 ถึง S14 ท้ายไฟล์
#
#   ฉบับที่ยังกู้ไม่ได้และไม่เกี่ยวกับงานนี้ คือ พ.ร.บ. ศาลปกครอง และ พ.ร.บ. วิธีปฏิบัติราชการทางปกครอง
